<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 56" fill="none">
  <!--
    GEARS. — Fibonacci-proportioned precision gear + logotype
    Fibonacci sequence references:
    - Inner core radius: 8px
    - Mid ring radius: 13px
    - Outer gear body radius: 21px
    - Gear center: (26, 28) -> Bottom edge of outer tooth/ring aligns at Y = 49
    - Baseline of "GEARS" and bottom of period "." strictly aligned at Y = 49
  -->
  <g id="fibonacci-gear" transform="translate(26, 28)">
    <!-- Subtle Fibonacci construction circles (engineering aesthetic) -->
    <circle r="21" stroke="#0F3A4D" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.35"/>
    <circle r="13" stroke="#0F3A4D" stroke-width="0.75" opacity="0.25"/>

    <!-- 8 Precision Gear Teeth (Symmetric octagonal mechanical profile, outer radius = 21) -->
    <path d="
      M -3.5 -21 L 3.5 -21 L 4.8 -16.5 L -4.8 -16.5 Z
      M -3.5 21 L 3.5 21 L 4.8 16.5 L -4.8 16.5 Z
      M -21 -3.5 L -21 3.5 L -16.5 4.8 L -16.5 -4.8 Z
      M 21 -3.5 L 21 3.5 L 16.5 4.8 L 16.5 -4.8 Z
    " fill="#0A192F"/>
    <g transform="rotate(45)">
      <path d="
        M -3.5 -21 L 3.5 -21 L 4.8 -16.5 L -4.8 -16.5 Z
        M -3.5 21 L 3.5 21 L 4.8 16.5 L -4.8 16.5 Z
        M -21 -3.5 L -21 3.5 L -16.5 4.8 L -16.5 -4.8 Z
        M 21 -3.5 L 21 3.5 L 16.5 4.8 L 16.5 -4.8 Z
      " fill="#0A192F"/>
    </g>

    <!-- Main Gear Ring (Outer R=17.5, Inner R=13 [Fibonacci 13]) -->
    <circle r="17.5" fill="#0A192F"/>
    <circle r="13" fill="#FFFFFF"/>

    <!-- Inner Fibonacci Core Ring (R=8 [Fibonacci 8], Inner Bore R=3 [Fibonacci 3]) -->
    <circle r="8" fill="#0F3A4D"/>
    <circle r="3" fill="#FFFFFF"/>

    <!-- Golden Spiral / Fibonacci Precision Axis Tick Marks -->
    <line x1="-13" y1="0" x2="-8" y2="0" stroke="#0A192F" stroke-width="1.5"/>
    <line x1="8" y1="0" x2="13" y2="0" stroke="#0A192F" stroke-width="1.5"/>
    <line x1="0" y1="-13" x2="0" y2="-8" stroke="#0A192F" stroke-width="1.5"/>
    <line x1="0" y1="8" x2="0" y2="13" stroke="#0A192F" stroke-width="1.5"/>
  </g>

  <!-- Logotype "GEARS" aligned to baseline Y=49 -->
  <text x="58" y="49" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="38" letter-spacing="2.5" fill="#0A192F">GEARS</text>

  <!-- Terminal Period "." strictly aligned with bottom edge of the gear (Y=49) -->
  <rect x="193" y="42" width="7" height="7" fill="#0F3A4D"/>
</svg>
